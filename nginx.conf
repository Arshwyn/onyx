server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite content-hashes files under /assets, so they're safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and manifest must always be revalidated so the
    # autoUpdate mechanism sees new deploys instead of serving a stale shell.
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
