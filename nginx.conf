server {
    # IPv4 only: the official entrypoint's IPv6 auto-listen step cannot edit
    # conf.d on a read-only rootfs, so no [::] listener is added.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health probe used by the image HEALTHCHECK; not part of the SPA.
    location = /healthz {
        access_log off;
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite content-hashes files under /assets, so they're safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and manifest must always be revalidated so the
    # autoUpdate mechanism sees new deploys instead of serving a stale shell.
    location ~ ^/(sw\.js|manifest\.webmanifest|registerSW\.js|workbox-.*\.js)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
