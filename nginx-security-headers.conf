# Security response headers, included by every location in nginx.conf
# (add_header in a location replaces, rather than adds to, the inherited set).
# The two Supabase origin placeholders in connect-src are rendered from the
# VITE_SUPABASE_URL build arg in the Dockerfile.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self' @SUPABASE_ORIGIN@ @SUPABASE_WSS_ORIGIN@; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
