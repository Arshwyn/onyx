services:
  onyx:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: onyx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:+${BIND_ADDR}:}${PORT:-3010}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
